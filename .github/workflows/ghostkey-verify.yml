# Test the ghostkey-verify crate (rust/gkverify), the verify-only Ghost Key
# library that Freenet contracts link.
#
# Three things a contract depends on, each checked here because nothing else
# would notice it breaking:
#   1. It agrees with ghostkey_lib (rust/gklib), which is why gklib changes
#      run this too.
#   2. Its dependency tree has no `rand` and no `getrandom`. A new dependency
#      or feature that pulls either in would build natively and break every
#      contract built for wasm32-unknown-unknown.
#   3. Built for wasm32, it imports nothing from the host and verifies real
#      proofs (bignum code takes a different path on 32-bit limbs).
# No lockfile is committed (the repo ignores Cargo.lock), so each run resolves
# dependencies as a new downstream contract would. The weekly run catches an
# upstream release that breaks any of the three without a change here. The
# toolchain is stable, unpinned, for the same reason: a red weekly run can be a
# new Rust release (a clippy lint, say) rather than a dependency.
name: ghostkey-verify

on:
  pull_request:
    paths:
      - "rust/gkverify/**"
      - "rust/gklib/**"
      - ".github/workflows/ghostkey-verify.yml"
  push:
    branches: [main]
    paths:
      - "rust/gkverify/**"
      - "rust/gklib/**"
      - ".github/workflows/ghostkey-verify.yml"
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostkey-verify-${{ github.ref }}
  # Superseded PR pushes are cancelled; runs on main are not, so every main
  # commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust/gkverify
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/gkverify
            rust/gkverify/wasm-probe

      - name: Formatting
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path wasm-probe/Cargo.toml -- --check

      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path wasm-probe/Cargo.toml --release --target wasm32-unknown-unknown -- -D warnings

      - name: Test (differential against ghostkey_lib)
        run: cargo test

      - name: No rand or getrandom in the dependency tree
        run: |
          tree=$(cargo tree -e normal,build --target all --prefix none)
          echo "$tree" | sort -u
          if echo "$tree" | grep -E '^(rand|getrandom) v'; then
            echo "::error::rand or getrandom is in ghostkey-verify's dependency tree"
            exit 1
          fi

      - name: Build the wasm probe
        working-directory: rust/gkverify/wasm-probe
        run: cargo build --release --target wasm32-unknown-unknown

      - name: The wasm module imports nothing
        run: python3 scripts/check_wasm_imports.py wasm-probe/target/wasm32-unknown-unknown/release/ghostkey_verify_wasm_probe.wasm

      - name: Proofs verify under wasm
        run: node scripts/run_wasm_vectors.mjs wasm-probe/target/wasm32-unknown-unknown/release/ghostkey_verify_wasm_probe.wasm target/tmp/wasm-vectors

      # Builds the packaged crate on its own, without the tests, scripts and
      # probe it excludes, and with the path dev-dependency stripped: what
      # crates.io will receive.
      - name: Package
        run: cargo package --allow-dirty

  # Holds `rust-version` in Cargo.toml to the truth: it was wrong once, and
  # only reading the dependencies' manifests showed it.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust/gkverify
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown
      - name: Check the library at its rust-version
        run: |
          cargo check --lib
          cargo check --lib --target wasm32-unknown-unknown
