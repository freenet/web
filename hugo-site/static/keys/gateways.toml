# Freenet bootstrap gateways.
#
# Names are ROLE-based (gwN.freenet.org), deliberately not machine-based. A
# gateway can then move host with a DNS change and nothing else — the churn that
# migrating off AWS in August 2026 had to pay for.
#
# Peers re-fetch this file at every startup, so changes here take effect as peers
# restart. The previous personal-domain names were removed on 2026-08-29; keep
# their DNS records alive for a while yet, because a peer holding an older copy
# of this file still resolves them.

# gw1 — primary gateway.
[[gateways]]
public_key = "keys/public.nova.gw.pem"

[gateways.address]
hostname = "gw1.freenet.org:31337"

# gw2 — secondary gateway. Replaces the AWS gateway retired on 2026-08-29 to cut
# about $198/mo. It is a second process on the same host as gw1, hence the
# distinct port: both names resolve to one address and only one process can bind
# 31337. It has its own identity, not the retired gateway's keypair — reusing
# that key would have preserved nothing (the address changes either way, so peers
# reconnect regardless, and ring Location is address-derived) while making a peer
# with a stale copy of this file fail a handshake against gw1.
[[gateways]]
public_key = "keys/public.gw2.pem"

[gateways.address]
hostname = "gw2.freenet.org:31338"

# Secondary gateway on independent infrastructure (AWS, different provider,
# different /24, different uplink) while it is being retired.
#
# Addressed by bare IP deliberately. The name it used to carry was under a
# personal domain, and this box is being shut down, so a new DNS record for it
# would be churn for nothing. `hostname` with an IP literal resolves without
# touching a DNS resolver at all (std's ToSocketAddrs parses it directly).
#
# `hostname` rather than `host_address`: host_address deserializes to
# Option<SocketAddr>, so a malformed value is a serde error for the WHOLE
# document and EVERY gateway is lost. With hostname it degrades to this one
# gateway failing at dial time. Fail-soft matters more than exact typing in a
# file that every peer fetches.
#
# REMOVE THIS ENTRY when the box is actually shut down. Until then it is the
# only listed gateway outside the host that runs gw1 and gw2, so dropping it
# early would leave every refetching peer with a bootstrap set confined to a
# single machine, IP, uplink and datacenter.
[[gateways]]
public_key = "keys/public.vega.gw.pem"

[gateways.address]
hostname = "100.27.151.80:31337"
