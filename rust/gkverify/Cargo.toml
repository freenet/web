[package]
name = "ghostkey-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Verify-only Ghost Key certificate chains, small enough to link into a Freenet contract: no key generation, no blinding, no RNG."
license = "MIT OR Apache-2.0"
repository = "https://github.com/freenet/web"
readme = "README.md"
keywords = ["freenet", "ghostkey", "verification", "wasm"]
categories = ["cryptography", "wasm"]
# CI-only: the wasm probe and its scripts, and the tests, which need
# ghostkey_lib from this repository to build.
exclude = ["scripts/", "wasm-probe/", "tests/"]

[lib]
name = "ghostkey_verify"

[dependencies]
# Every dependency is verify-only and RNG-free. Nothing here may pull in
# `rand` or `getrandom`: a Freenet contract has no source of randomness, and
# `getrandom` refuses to build for wasm32-unknown-unknown without one. CI
# checks this with `cargo tree` (see .github/workflows/ghostkey-verify.yml).
ed25519-dalek = { version = "2.1", default-features = false, features = ["serde"] }
# rsa 0.9 (the newest stable line) is not used because it depends on
# num-bigint-dig with the `prime` feature, which pulls in `rand`. The 0.10
# line replaces that with crypto-bigint and needs only `rand_core`, which
# this crate never calls. Pinned exactly because 0.10 is still a release
# candidate and its API moves between candidates.
rsa = { version = "=0.10.0-rc.19", default-features = false }
sha2 = { version = "0.11", default-features = false }
ciborium = { version = "0.2.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[dev-dependencies]
# The reference implementation the differential tests compare against.
ghostkey_lib = { path = "../gklib" }
blind-rsa-signatures = "=0.15.1"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8.5"
ciborium = "0.2.2"
# The rsa that blind-rsa-signatures, and so ghostkey_lib, verifies with.
rsa_08 = { package = "rsa", version = "0.8.2" }

# The differential tests run thousands of RSA operations; unoptimized
# bignum arithmetic would take minutes.
[profile.dev.package."*"]
opt-level = 3
